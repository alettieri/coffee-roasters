# Keep this compatibility date aligned with nuxt.config.ts. The Node.js
# compatibility flags are required for Postgres.js runtime access through
# Cloudflare Hyperdrive.
name = "coffee-roasters"
compatibility_date = "2026-06-23"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]
pages_build_output_dir = "dist"

[env.production.vars]
APP_ENV = "production"
BETTER_AUTH_URL = "https://coffee-roasters.pages.dev"

[[env.production.hyperdrive]]
binding = "PRODUCTION_HYPERDRIVE"
id = "592a32d6183f461c9d531eb3d990918e"
