services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_roasters_dev
      POSTGRES_PASSWORD: coffee_roasters_local
      POSTGRES_USER: coffee_roasters
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --dbname coffee_roasters_dev --username coffee_roasters',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '54329:5432'
    volumes:
      - coffee_roasters_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  coffee_roasters_postgres_data:
