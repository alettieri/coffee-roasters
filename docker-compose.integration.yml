services:
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_roasters_test
      POSTGRES_PASSWORD: coffee_roasters_integration
      POSTGRES_USER: coffee_roasters_integration
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --dbname coffee_roasters_test --username coffee_roasters_integration',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '54330:5432'
    volumes:
      - coffee_roasters_integration_postgres_data:/var/lib/postgresql/data

volumes:
  coffee_roasters_integration_postgres_data:
