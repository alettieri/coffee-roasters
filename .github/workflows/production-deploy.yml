name: Production Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CI: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      }}
    permissions:
      contents: read
      deployments: write
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Record release identifier
        run: |
          echo "APP_RELEASE=${RELEASE_SHA}" >> "$GITHUB_ENV"
          echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          package_json_file: package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production database migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Build production output
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: >-
          pnpm exec wrangler pages deploy dist/
          --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME"
          --branch main
          --commit-hash "$APP_RELEASE"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

      - name: Run production smoke checks
        run: |
          curl --fail --show-error --silent --location --max-time 20 "$PRODUCTION_SMOKE_HEALTH_URL" >/dev/null
          curl --fail --show-error --silent --location --max-time 20 "$PRODUCTION_SMOKE_PUBLIC_DISCOVERY_URL" >/dev/null
        env:
          PRODUCTION_SMOKE_HEALTH_URL: ${{ vars.PRODUCTION_SMOKE_HEALTH_URL }}
          PRODUCTION_SMOKE_PUBLIC_DISCOVERY_URL: ${{ vars.PRODUCTION_SMOKE_PUBLIC_DISCOVERY_URL }}
